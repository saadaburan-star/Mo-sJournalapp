[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path serves the shell. There are no other routes in
# Phase 1, but this keeps a refresh on any URL from 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
